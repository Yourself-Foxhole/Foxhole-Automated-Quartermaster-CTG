[loggers]
keys=root, main, Bot, SlashCog

[handlers]
keys=consoleHandler, fileHandler

[formatters]
keys=defaultFormatter

[logger_root]
handlers=consoleHandler
qualname=root

[logger_main]
handlers=consoleHandler, fileHandler
level=DEBUG
propagate=0
qualname=main

[logger_Bot]
handlers=consoleHandler, fileHandler
level=DEBUG
propagate=0
qualname=Bot

[logger_SlashCog]
handlers=consoleHandler, fileHandler
level=DEBUG
propagate=0
qualname=SlashCog

[handler_fileHandler]
class=FileHandler
level=DEBUG
formatter=defaultFormatter
args=('log.txt', 'w')

[handler_consoleHandler]
class=logging.StreamHandler
formatter=defaultFormatter
args=(sys.stdout,)

[formatter_defaultFormatter]
format=%(levelname)s %(asctime)s %(filename)s - %(message)s